name: Bug report
description: Something in SmartTube Material does not work
title: "[BUG]: "
labels: [bug]

body:
  - type: markdown
    attributes:
      value: |
        This is the tracker of the SmartTube Material fork. If the same thing happens in the original SmartTube, it is
        probably not caused by this fork: check there first, and only send it here when the problem is in the new
        interface or the updater. Never paste an account token or a link with a sign-in code in it.

  - type: input
    id: version
    attributes:
      label: Version
      description: "Settings, About."
      placeholder: "32.68-1"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: "Chromecast with Google TV, Android 12"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: What you did, what you expected, what happened
      placeholder: |
        1. Hold OK on Subscribe ...
        2. ...
    validations:
      required: true
