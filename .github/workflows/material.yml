name: SmartTube Material

on:
  push:
    branches: [material]
    tags: ['material-v*']
  pull_request:
    branches: [material]
  workflow_dispatch:

# Nothing is writable unless a job asks for it.
permissions: {}

jobs:
  # Runs for every trigger. Has no access to secrets and cannot write anything.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Unit tests
        run: ./gradlew --no-daemon :smarttubetv:testStmaterialDebugUnitTest :common:testStfdroidDebugUnitTest

  # Tags only. The only job that sees the signing key.
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/material-v')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write      # create the GitHub Release
      id-token: write      # sign the provenance attestation
      attestations: write  # store the attestation
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Require the signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.MATERIAL_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MATERIAL_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MATERIAL_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MATERIAL_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret MATERIAL_${name} is missing. Refusing to release a debug-signed APK."
              exit 1
            fi
          done

      - name: Unit tests
        run: ./gradlew --no-daemon :smarttubetv:testStmaterialDebugUnitTest :common:testStfdroidDebugUnitTest

      - name: Build the signed release APKs
        env:
          KEYSTORE_B64: ${{ secrets.MATERIAL_KEYSTORE_B64 }}
          MATERIAL_KEYSTORE_PASSWORD: ${{ secrets.MATERIAL_KEYSTORE_PASSWORD }}
          MATERIAL_KEY_ALIAS: ${{ secrets.MATERIAL_KEY_ALIAS }}
          MATERIAL_KEY_PASSWORD: ${{ secrets.MATERIAL_KEY_PASSWORD }}
          MATERIAL_REQUIRE_RELEASE_SIGNING: 'true'
        run: |
          umask 077
          export MATERIAL_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$MATERIAL_KEYSTORE_FILE"
          ./gradlew --no-daemon :smarttubetv:assembleStmaterialRelease

      - name: Verify the signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          for apk in smarttubetv/build/outputs/apk/stmaterial/release/*.apk; do
            echo "$apk"
            "$APKSIGNER" verify --print-certs "$apk" | grep -E 'Signer #1 certificate (DN|SHA-256)'
            if "$APKSIGNER" verify --print-certs "$apk" | grep -q 'CN=Android Debug'; then
              echo "::error::$apk is signed with the debug key"
              exit 1
            fi
          done

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: smarttubetv/build/outputs/apk/stmaterial/release/*.apk

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" smarttubetv/build/outputs/apk/stmaterial/release/*.apk \
            --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes

      - name: Remove the signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
