name: SmartTube Material

on:
  push:
    branches: [material]
    tags: ['material-v*']
  pull_request:
    branches: [material]
  workflow_dispatch:

# Nothing is writable unless a job asks for it.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Runs for every trigger. Has no access to secrets and cannot write anything.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Sync logic tests
        run: python3 -I -B -m unittest discover -s scripts/sync

      - name: Unit tests
        run: ./gradlew --no-daemon :smarttubetv:testStmaterialDebugUnitTest :common:testStfdroidDebugUnitTest

  # Push to the material branch and manual runs: proves the release variant builds on this runner before a tag does.
  # Debug-signed (no secrets here), never uploaded.
  build-check:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/material')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install the SDK parts the build pins
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "ndk;21.0.6113669" "build-tools;36.0.0" "platforms;android-36"

      - name: Assemble the release variant
        run: ./gradlew --no-daemon :smarttubetv:assembleStmaterialRelease

  # Tags only. Builds with no secret and signs in a separate job, see material-release.yml.
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/material-v')
    needs: test
    permissions:
      contents: write      # create the GitHub Release
      id-token: write      # sign the provenance attestation
      attestations: write  # store the attestation
    uses: ./.github/workflows/material-release.yml
    with:
      tag: ${{ github.ref_name }}
      sha: ${{ github.sha }}
    secrets:
      MATERIAL_KEYSTORE_B64: ${{ secrets.MATERIAL_KEYSTORE_B64 }}
      MATERIAL_KEYSTORE_PASSWORD: ${{ secrets.MATERIAL_KEYSTORE_PASSWORD }}
      MATERIAL_KEY_ALIAS: ${{ secrets.MATERIAL_KEY_ALIAS }}
      MATERIAL_KEY_PASSWORD: ${{ secrets.MATERIAL_KEY_PASSWORD }}
