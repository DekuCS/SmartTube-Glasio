name: SmartTube Material release

# Two callers: material.yml for a pushed tag, material-sync.yml for the commit it has just verified and pushed. A tag
# pushed with GITHUB_TOKEN starts no workflow, so the sync calls this.
#
# The build runs the repository's Gradle code and upstream's, so it gets no secret. The key lives only in `sign`,
# which never checks out or runs anything from the repository: its input is the APKs and its tools are the SDK's.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag, material-v<versionName>
        required: true
        type: string
      sha:
        description: Full commit to build. The GitHub Release creates the tag here if it does not exist.
        required: true
        type: string
      unattended:
        description: The sync is calling, not a person who pushed a tag. Signing then needs MATERIAL_SYNC_ENABLED.
        required: false
        type: boolean
        default: false
    secrets:
      MATERIAL_KEYSTORE_B64:
        required: true
      MATERIAL_KEYSTORE_PASSWORD:
        required: true
      MATERIAL_KEY_ALIAS:
        required: true
      MATERIAL_KEY_PASSWORD:
        required: true

permissions: {}

env:
  BUILD_TOOLS_VERSION: 36.0.0

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          submodules: recursive
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Tag must match versionName
        env:
          TAG: ${{ inputs.tag }}
        run: python3 -I -B scripts/sync/sync.py check-tag --tag "$TAG"

      - name: Install the SDK parts the build pins
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "ndk;21.0.6113669" "build-tools;$BUILD_TOOLS_VERSION" "platforms;android-36"

      - name: Build the unsigned release APKs
        env:
          MATERIAL_UNSIGNED_RELEASE: 'true'
        run: ./gradlew --no-daemon :smarttubetv:assembleStmaterialRelease

      - name: Hand the APKs to the signing job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-apks
          path: smarttubetv/build/outputs/apk/stmaterial/release/*.apk
          retention-days: 1
          if-no-files-found: error

  # The only job that sees the signing key. Add no checkout here and run nothing that came from the artifact.
  sign-skipped:
    needs: build
    if: inputs.unattended && vars.MATERIAL_SYNC_ENABLED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Say why nothing is signed
        run: echo "::notice::MATERIAL_SYNC_ENABLED is not true, so the sync signs and publishes nothing."

  sign:
    needs: build
    if: "!inputs.unattended || vars.MATERIAL_SYNC_ENABLED == 'true'"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write      # create the GitHub Release
      id-token: write      # sign the provenance attestation
      attestations: write  # store the attestation
    steps:
      - name: Require the signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.MATERIAL_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MATERIAL_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MATERIAL_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MATERIAL_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret MATERIAL_${name} is missing. Refusing to release a debug-signed APK."
              exit 1
            fi
          done

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install the pinned build-tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "build-tools;$BUILD_TOOLS_VERSION"

      - name: Take the unsigned APKs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-apks
          path: ${{ runner.temp }}/unsigned

      - name: The APKs must be the expected files of this release
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION=${TAG#material-v}
          shopt -s dotglob nullglob
          ENTRIES=("$RUNNER_TEMP"/unsigned/*)
          if [ "${#ENTRIES[@]}" -ne 3 ]; then
            echo "::error::Unexpected artifact contents."
            exit 1
          fi
          for ABI in arm64-v8a armeabi-v7a universal; do
            APK="$RUNNER_TEMP/unsigned/SmartTube_material_${VERSION}_$ABI.apk"
            if [ ! -f "$APK" ] || [ -L "$APK" ]; then
              echo "::error::Unexpected artifact contents."
              exit 1
            fi
          done
          AAPT2="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/aapt2"
          for apk in "$RUNNER_TEMP"/unsigned/*.apk; do
            HEADER=$("$AAPT2" dump badging "$apk" | sed -n 1p)
            case "$HEADER" in
              "package: name='io.github.ivanosh.smarttubematerial' versionCode='"*"' versionName='$VERSION' "*) ;;
              *)
                echo "::error::$(basename "$apk") is not this release: $HEADER"
                exit 1
                ;;
            esac
          done

      # Reads the artifact, so it runs before the keystore exists and without the secrets.
      - name: Align
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/aligned"
          for apk in "$RUNNER_TEMP"/unsigned/*.apk; do
            "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/zipalign" -f -P 16 4 "$apk" "$RUNNER_TEMP/aligned/$(basename "$apk")"
          done

      - name: Sign
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.MATERIAL_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MATERIAL_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MATERIAL_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MATERIAL_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          mkdir -p "$RUNNER_TEMP/signed"
          for apk in "$RUNNER_TEMP"/aligned/*.apk; do
            # env: keeps the passwords out of the process list.
            "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" sign --ks "$RUNNER_TEMP/release.jks" \
              --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
              --v2-signing-enabled true --v3-signing-enabled true --v4-signing-enabled false \
              --out "$RUNNER_TEMP/signed/$(basename "$apk")" "$apk"
          done
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Verify the signature
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED=8619c34516110bf503c6850f1c405778fae8fd318beb82b138db207724748e8c
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"
          for apk in "$RUNNER_TEMP"/signed/*.apk; do
            ACTUAL=$("$APKSIGNER" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
            echo "$(basename "$apk") $ACTUAL"
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "::error::$(basename "$apk") is not signed with the expected certificate"
              exit 1
            fi
          done

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/signed/*.apk

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SHA: ${{ inputs.sha }}
        run: |
          gh release create "$TAG" "$RUNNER_TEMP"/signed/*.apk \
            --repo "$GITHUB_REPOSITORY" --title "$TAG" --prerelease --target "$SHA" --generate-notes \
            --notes "Version ${TAG#material-v}. Signing certificate SHA-256 8619c34516110bf503c6850f1c405778fae8fd318beb82b138db207724748e8c."

      - name: Remove the signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
