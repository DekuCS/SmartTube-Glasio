name: SmartTube Material upstream sync

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report what would happen. Push, release and issues stay untouched.
        type: boolean
        default: true

permissions: {}

# One sync at a time: two runs must not both file an issue or push.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # Picks the tag, runs the gate, merges locally. Upstream's commits are read here, never run: no submodules, no JDK,
  # no Gradle. The merge commit leaves this job as a bundle, pinned by its SHA in the outputs.
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
    outputs:
      action: ${{ steps.decide.outputs.action }}
      tag: ${{ steps.decide.outputs.tag }}
      base_sha: ${{ steps.base.outputs.sha }}
      merge_sha: ${{ steps.decide.outputs.merge_sha }}
      release_tag: ${{ steps.decide.outputs.release_tag }}
      dry_run: ${{ steps.decide.outputs.dry_run }}
      enabled: ${{ steps.enabled.outputs.enabled }}
    steps:
      - name: Read whether the sync may publish
        id: enabled
        env:
          ENABLED: ${{ vars.MATERIAL_SYNC_ENABLED }}
        run: |
          # Here and not only in the job conditions: == in a workflow expression ignores case.
          if [ "$ENABLED" = true ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            MESSAGE="MATERIAL_SYNC_ENABLED is not true: this run only reports. Push, release and issue are skipped."
            echo "::notice::$MESSAGE"
            echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check out material
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: material
          path: repo
          fetch-depth: 0
          persist-credentials: false

      - name: Remember the commit this run starts from
        id: base
        run: echo "sha=$(git -C repo rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check out the sync scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.base.outputs.sha }}
          path: tools
          sparse-checkout: /scripts/sync/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Sync logic tests
        run: python3 -I -B -m unittest discover -s tools/scripts/sync

      - name: Read the upstream releases and our open issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DEFAULT_BRANCH=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)
          if [ "$DEFAULT_BRANCH" != material ]; then
            echo "::warning::The schedule only fires from the default branch, here $DEFAULT_BRANCH. See README-Material.md."
          fi
          gh api 'repos/yuliskov/SmartTube/releases?per_page=100' > "$RUNNER_TEMP/releases.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" > "$RUNNER_TEMP/issues.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/own-releases.json"

      - name: Pick the tag, gate it, merge it
        id: decide
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        working-directory: repo
        run: |
          python3 -I -B "$GITHUB_WORKSPACE/tools/scripts/sync/sync.py" decide --releases "$RUNNER_TEMP/releases.json" \
            --issues "$RUNNER_TEMP/issues.json" --own-releases "$RUNNER_TEMP/own-releases.json" \
            --out "$RUNNER_TEMP/sync-out" --dry-run "$DRY_RUN"

      - name: Hand the merge and the issue text to the next jobs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sync-out
          path: ${{ runner.temp }}/sync-out
          retention-days: 3
          if-no-files-found: ignore

  # First job where upstream's code runs: the gate has passed. No secrets, nothing writable, and no Gradle cache that
  # a later job could inherit.
  verify:
    needs: decide
    if: needs.decide.outputs.action == 'proceed' && (needs.decide.outputs.dry_run == 'true' || (needs.decide.outputs.enabled == 'true' && vars.MATERIAL_SYNC_ENABLED == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out the starting commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.decide.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Take the merge commit
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sync-out
          path: ${{ runner.temp }}/sync-out

      - name: Switch to it
        env:
          MERGE_SHA: ${{ needs.decide.outputs.merge_sha }}
        run: |
          python3 -I -B scripts/sync/sync.py apply-bundle --bundle "$RUNNER_TEMP/sync-out/merge.bundle" --sha "$MERGE_SHA"
          git submodule update --init --recursive

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install the SDK parts the build pins
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "ndk;21.0.6113669" "build-tools;36.0.0" "platforms;android-36"

      - name: Unit tests
        run: ./gradlew --no-daemon :smarttubetv:testStmaterialDebugUnitTest :common:testStfdroidDebugUnitTest

      - name: Assemble the release variant
        run: ./gradlew --no-daemon :smarttubetv:assembleStmaterialRelease

  # Nothing from the merged tree runs here, and the token exists only for the last step, which runs only git. No force:
  # if material moved, the push fails and the issue says so.
  publish:
    needs: [decide, verify]
    if: needs.decide.outputs.action == 'proceed' && needs.decide.outputs.dry_run == 'false' && needs.decide.outputs.enabled == 'true' && vars.MATERIAL_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the starting commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.decide.outputs.base_sha }}
          path: repo
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the sync scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.decide.outputs.base_sha }}
          path: tools
          sparse-checkout: /scripts/sync/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Take the merge commit
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sync-out
          path: ${{ runner.temp }}/sync-out

      - name: Unpack it without switching to it
        working-directory: repo
        env:
          MERGE_SHA: ${{ needs.decide.outputs.merge_sha }}
        run: python3 -I -B "$GITHUB_WORKSPACE/tools/scripts/sync/sync.py" apply-bundle --bundle "$RUNNER_TEMP/sync-out/merge.bundle" --sha "$MERGE_SHA" --no-checkout

      - name: Push exactly that commit to material
        working-directory: repo
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ needs.decide.outputs.merge_sha }}
        run: |
          git -c credential.helper= \
            -c 'credential.helper=!f() { test "$1" = get && printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; }; f' \
            push "https://github.com/$GITHUB_REPOSITORY" "$MERGE_SHA:refs/heads/material"

  # The same commit, built with no secret and signed in a later job, as for a tagged release. Also runs alone when an
  # earlier sync pushed its merge but no release followed (action release-only), after decide has rebuilt that merge
  # from its parents and compared the trees.
  release:
    needs: [decide, publish]
    if: >-
      ${{ !cancelled() && needs.decide.result == 'success' && needs.decide.outputs.dry_run == 'false' &&
      needs.decide.outputs.enabled == 'true' && vars.MATERIAL_SYNC_ENABLED == 'true' && (needs.publish.result == 'success' || needs.decide.outputs.action == 'release-only') }}
    permissions:
      contents: write      # create the GitHub Release
      id-token: write      # sign the provenance attestation
      attestations: write  # store the attestation
    uses: ./.github/workflows/material-release.yml
    with:
      tag: ${{ needs.decide.outputs.release_tag }}
      sha: ${{ needs.decide.outputs.merge_sha }}
      unattended: true
    secrets:
      MATERIAL_KEYSTORE_B64: ${{ secrets.MATERIAL_KEYSTORE_B64 }}
      MATERIAL_KEYSTORE_PASSWORD: ${{ secrets.MATERIAL_KEYSTORE_PASSWORD }}
      MATERIAL_KEY_ALIAS: ${{ secrets.MATERIAL_KEY_ALIAS }}
      MATERIAL_KEY_PASSWORD: ${{ secrets.MATERIAL_KEY_PASSWORD }}

  # A stop or a failure leaves one issue per upstream tag if it can, and turns the run red whether it could or not:
  # GitHub's failure email is what reaches the owner. While the issue is open, decide skips the tag.
  report:
    needs: [decide, verify, publish, release]
    if: ${{ !cancelled() && needs.decide.outputs.dry_run != 'true' && needs.decide.outputs.action != 'noop' && needs.decide.outputs.enabled == 'true' && vars.MATERIAL_SYNC_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out the sync scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.decide.outputs.base_sha || 'material' }}
          path: tools
          sparse-checkout: /scripts/sync/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Take the issue text
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sync-out
          path: ${{ runner.temp }}/sync-out

      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ needs.decide.outputs.action }}
          TAG: ${{ needs.decide.outputs.tag }}
          MERGE_SHA: ${{ needs.decide.outputs.merge_sha }}
          RELEASE_TAG: ${{ needs.decide.outputs.release_tag }}
          DECIDE: ${{ needs.decide.result }}
          VERIFY: ${{ needs.verify.result }}
          PUBLISH: ${{ needs.publish.result }}
          RELEASE: ${{ needs.release.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 -I -B "$GITHUB_WORKSPACE/tools/scripts/sync/sync.py" report --repo "$GITHUB_REPOSITORY" --tag "$TAG" --action "$ACTION" \
            --body-file "$RUNNER_TEMP/sync-out/issue-body.md" --run-url "$RUN_URL" --merge-sha "$MERGE_SHA" --release-tag "$RELEASE_TAG" \
            --results "decide=$DECIDE" "verify=$VERIFY" "publish=$PUBLISH" "release=$RELEASE"
