// Types from other modules the Compose compiler cannot infer as stable, though they are immutable (equal values are
// interchangeable): declared stable so composables taking them skip by equality. Only immutable types belong here.
// NOT here: Video and VideoGroup (module common). They are mutable Java classes (fields set after creation, no
// equals that covers their state), so listing them would make a composable skip while the card shows stale data.
// https://developer.android.com/develop/ui/compose/performance/stability/fix#configuration-file
